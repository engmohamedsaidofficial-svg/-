name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Add fresh Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
      - name: Add notification permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          echo "🔍 Checking manifest before adding permissions..."
          grep -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|VIBRATE|SCHEDULE_EXACT_ALARM|INTERNET' "$MANIFEST" || true
          
          # إضافة كل الإذونات المطلوبة للإشعارات والأذان
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' "$MANIFEST"
          
          echo "✅ Permissions added successfully!"
          echo "📋 Final permissions in manifest:"
          grep -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|VIBRATE|SCHEDULE_EXACT_ALARM' "$MANIFEST"
      # ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←

      - name: Copy custom icon (Adaptive Icon)
        run: |
          echo "Copying custom icon from www/icon.png..."
          cp www/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png || true
          cp www/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png || true
          cp www/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png || true
          cp www/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png || true
          cp www/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png || true
          echo "Custom icon copied successfully"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azkar-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Remove old android folder (مهم جداً)
        run: rm -rf android

      - name: Add Android platform fresh
        run: npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap sync android

      - name: Build Debug APK (with full stacktrace)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azkar-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

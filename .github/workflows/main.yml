name: Build Android APK

on:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Install Capacitor
    run: |
      npm install -g @capacitor/cli
      npm install @capacitor/core @capacitor/android @capacitor/local-notifications

  - name: Create basic package.json
    run: |
      echo '{
        "name": "azkar-app",
        "version": "1.0.0"
      }' > package.json

  - name: Init Capacitor
    run: npx cap init azkar com.azkar.app --web-dir=.

  - name: Add Android platform
    run: npx cap add android

  - name: Sync project
    run: npx cap sync android

  - name: Add notification permissions
    run: |
      sed -i '/<manifest/a \
      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
      <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\
      <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml

  - name: Build APK
    run: cd android && ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: azkar-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk

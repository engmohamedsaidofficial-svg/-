name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Capacitor Doctor
        run: npx cap doctor || true

      - name: Install Capacitor Android package (مهم)
        run: npm install @capacitor/android

      - name: Add Android platform (مع force)
        run: npx cap add android --force || echo "Add platform attempted"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Azkar-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # لو عندك package-lock.json في مجلد فرعي، حدد المسار هنا:
          # cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm install   # استخدمنا npm install عشان مش محتاجين lock file

      - name: Capacitor Doctor (للتشخيص)
        run: npx cap doctor || true

      - name: Add Android platform if needed
        run: npx cap add android || echo "Android already added"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Azkar-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

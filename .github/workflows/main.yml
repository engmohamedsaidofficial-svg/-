name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install all dependencies
        run: npm install

      - name: Install Capacitor packages explicitly
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Build web assets
        run: npm run build || echo "No build script found - skipping..."

      - name: Capacitor Doctor
        run: npx cap doctor || true

      - name: Add Android platform
        run: |
          npx cap add android || echo "Add platform attempted (may have failed silently)"
          ls -la android || echo "❌ android folder STILL missing after add!"

      - name: Copy & Sync Capacitor
        run: |
          npx cap copy android
          npx cap sync android

      - name: Build Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "❌ Android folder is still missing! Cannot build APK."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Azkar-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

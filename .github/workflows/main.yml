name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor + Local Notifications
        run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/local-notifications

      - name: Add fresh Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>|' $MANIFEST
          echo "Manifest patched:"
          grep "permission" $MANIFEST

      - name: Copy custom icon (Adaptive Icon)
        run: |
          echo "Copying custom icon from www/icon.png..."
          cp www/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png || true
          cp www/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png || true
          cp www/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png || true
          cp www/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png || true
          cp www/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png || true
          echo "Custom icon copied successfully"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Azkar-Debug-APK-\( {{ github.run_id }}- \){{ github.run_attempt }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
          retention-days: 5

name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/android @capacitor/cli

      - name: Capacitor Doctor
        run: npx cap doctor || true

      - name: Add Android platform (force)
        run: |
          npx cap add android --force || true
          ls -la android || echo "android folder not created!"

      - name: Sync Capacitor
        run: npx cap sync android --deployment || true

      - name: Build Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "❌ Android folder still missing!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Azkar-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
